<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dummy Links</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin-bottom: 24px;
            color: #333;
        }
        .btn-container {
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            background-color: #007bff;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome</h1>
        <div class="btn-container">
            <!-- First Dummy Link Button -->
            <a href="/ourbills/APMI-Bill-Generator.html" class="btn" target="_blank" rel="noopener noreferrer">Bill</a>
            
            <!-- Second Dummy Link Button -->
            <a href="/ourbills/APMI-Quotation-Generator.html" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">Quotation</a>
        </div>
    </div>

</body>
</html>
